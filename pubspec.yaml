name: steriymed_mobile
description: SteryMed — Traçabilité stérilisation et dossiers prothétiques
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  photo_view: ^0.15.0
  permission_handler: ^11.3.1
  intl: ^0.20.3
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  http: ^1.2.2
  sentry_flutter: ^9.30.1
  package_info_plus: ^9.0.1
  pdf: ^3.11.1
  printing: ^5.13.4
  open_filex: ^4.5.0
  share_plus: ^12.0.2
  local_auth: ^3.0.2
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # The app's typography is `Inter` (core/theme/typography.dart). Without
    # this section the family is not registered and every screen silently
    # falls back to the system font.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
