name: Mobile — Test

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile-test.yml"
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        # Same exclusion as .git/hooks/pre-commit: the repo has ~27
        # pre-existing empty test-file stubs (0 bytes, no main()) that
        # fail to even compile and were never a real regression signal.
        run: |
          test_files=$(find test -name "*_test.dart" -exec grep -l "void main(" {} \;)
          flutter test --coverage $test_files

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
