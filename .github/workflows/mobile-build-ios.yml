name: Mobile — Build iOS (simulator)

on:
  pull_request:
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile-build-ios.yml"
  push:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter_secure_storage and mobile_scanner don't support Swift
      # Package Manager yet, and this project has no committed ios/Podfile
      # (never needed one before Flutter defaulted to SPM) — the resulting
      # SPM+auto-generated-CocoaPods hybrid fails to link Pods_Runner.
      # Force pure CocoaPods, Flutter's documented workaround.
      - name: Disable Swift Package Manager (unsupported plugins)
        run: flutter config --no-enable-swift-package-manager

      - name: Build for simulator (no code signing)
        run: flutter build ios --simulator --no-codesign
