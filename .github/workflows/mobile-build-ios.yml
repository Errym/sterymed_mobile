name: Mobile — Build iOS (simulator)

on:
  pull_request:
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile-build-ios.yml"
  push:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # KNOWN FAILING as of 2026-09-22 — "Framework 'Pods_Runner' not
      # found" linker error. Root cause: no committed ios/Podfile, plus
      # flutter_secure_storage/mobile_scanner not supporting Swift Package
      # Manager, leaves the project in a broken SPM/CocoaPods hybrid state.
      # `flutter config --no-enable-swift-package-manager` does NOT fix
      # this (confirmed against flutter_tools source — the SPM warning is
      # unconditional and unrelated to the actual linker failure). Needs
      # interactive Xcode/macOS debugging. See docs/DAILY_LOG.md.
      - name: Build for simulator (no code signing)
        run: flutter build ios --simulator --no-codesign
